[package]
name = "musiton-app"
description = "Musiton DAW application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "musiton"

[[bin]]
name = "musiton"
path = "src/main.rs"

[dependencies]
musiton-core.workspace = true
musiton-engine.workspace = true
musiton-io.workspace = true
musiton-project.workspace = true
musiton-ui.workspace = true
anyhow.workspace = true
ron.workspace = true
eframe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6"
rfd = "0.17"
rtrb = "0.4"
musiton-devices.workspace = true

[lints]
workspace = true

# Windows installer: `cargo packager --release -p musiton-app` (see .github/workflows/installer.yml).
[package.metadata.packager]
product-name = "Musiton"
identifier = "org.musiton.daw"
publisher = "Musiton"
description = "Musiton – a digital audio workstation"
category = "Music"
icons = ["assets/icon.ico", "assets/icon-256.png"]
formats = ["nsis"]
before-packaging-command = "cargo build --release -p musiton-app"
binaries-dir = "../../target/release"
out-dir = "../../target/packages"
binaries = [{ path = "musiton", main = true }]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[[package.metadata.packager.file-associations]]
extensions = ["musiton"]
name = "Musiton project"
description = "Musiton project"
mime-type = "application/x-musiton"
role = "editor"

[dev-dependencies]
hound = "3.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
