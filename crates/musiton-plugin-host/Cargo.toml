[package]
name = "musiton-plugin-host"
description = "VST3 plugin hosting for Musiton."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clack-host = "0.2"
libloading = "0.9.1"
musiton-core.workspace = true
musiton-engine.workspace = true
rtrb = "0.4"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
vst3 = "0.3"

# The only crate allowed to use `unsafe` (plugin FFI): the workspace lints minus the ban.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
