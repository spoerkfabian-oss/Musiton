name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Fetch FFmpeg (LGPL build, for the video track)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest | ConvertFrom-Json
          $asset = $rel.assets |
            Where-Object { $_.name -match '^ffmpeg-n([\d.]+)-latest-win64-lgpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_.name -replace '^ffmpeg-n([\d.]+)-.*$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object name -eq 'ffmpeg-master-latest-win64-lgpl.zip' }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $dir = Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item "$($dir.FullName)/bin/ffmpeg.exe" target/release/ffmpeg.exe
          Copy-Item "$($dir.FullName)/LICENSE.txt" target/release/FFMPEG-LICENSE.txt
      - name: Fetch bundled plugins (free and open source)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "target/release/plugins"
          # The build cache can keep an older plugins folder: start clean.
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out, "$out/licenses", dl | Out-Null
          # Only plugins under these licences are shipped (checked against GitHub's licence data).
          $free = 'GPL-3.0', 'GPL-3.0-or-later', 'GPL-2.0', 'GPL-2.0-or-later', 'LGPL-3.0', 'LGPL-2.1', 'MIT', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', 'Apache-2.0'
          $shipped = @()
          function Get-Plugin($name, $repo, $pattern, $licenceRepo, $only) {
            if (-not $licenceRepo) { $licenceRepo = $repo }
            try {
              $licence = gh api "repos/$licenceRepo" --jq '.license.spdx_id'
              if ($free -notcontains $licence) { Write-Warning "$name skipped: licence '$licence' is not on the list"; return }
              $rel = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
              $asset = $rel.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
              if (-not $asset) { Write-Warning "$name skipped: no asset matching $pattern; assets: $($rel.assets.name -join ', ')"; return }
              Write-Host "== $name $($rel.tag_name) ($licence): $($asset.name)"
              $dir = "dl\$($repo -replace '/','_')"
              Invoke-WebRequest $asset.browser_download_url -OutFile "$dir.zip"
              Expand-Archive "$dir.zip" -DestinationPath $dir -Force
              $found = 0
              # A .vst3 is a folder (bundle) or a file; never look inside a bundle. Skip 32-bit builds.
              $is32 = { param($f) $f -match '(?i)(\\|_|-)(x86|win32|32[ -]?bit)(\\|_|-|\.)' -and $f -notmatch '(?i)x86[_-]64' }
              Get-ChildItem $dir -Recurse -Filter *.vst3 | Where-Object { $_.FullName -notmatch '\.vst3\\.+' -and -not (& $is32 $_.FullName) -and (-not $only -or $_.Name -match $only) } |
                ForEach-Object { Copy-Item $_.FullName $out -Recurse -Force; Write-Host "VST3: $($_.Name)"; $found++ }
              Get-ChildItem $dir -Recurse -Filter *.clap -File | Where-Object { -not (& $is32 $_.FullName) -and (-not $only -or $_.Name -match $only) } |
                ForEach-Object { Copy-Item $_.FullName $out -Force; Write-Host "CLAP: $($_.Name)"; $found++ }
              if ($found -eq 0) { Write-Warning "${name}: no VST3 or CLAP in $($asset.name)"; return }
              $lic = "$out\licenses\$name"
              New-Item -ItemType Directory -Force $lic | Out-Null
              Get-ChildItem $dir -Recurse -File | Where-Object { $_.Name -match '(?i)^(licen[cs]e|copying|gpl)' } |
                ForEach-Object { Copy-Item $_.FullName $lic -Force }
              if (-not (Get-ChildItem $lic)) {
                gh api "repos/$licenceRepo/license" --jq '.content' | ForEach-Object { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_)) } | Set-Content "$lic\LICENSE.txt"
              }
              $script:shipped += "$name $($rel.tag_name) - licence $licence - source: https://github.com/$licenceRepo"
              return $rel.tag_name
            } catch {
              Write-Warning "$name skipped: $_"
            }
          }
          $surge = Get-Plugin 'Surge XT' 'surge-synthesizer/releases-xt' 'win64.*pluginsonly.*\.zip$' 'surge-synthesizer/surge'
          Get-Plugin 'Dexed' 'asb2m10/dexed' '(?i)win.*\.zip$' | Out-Null
          # Cardinal: only the VST3 synth and effect (the CLAP builds and the main "Cardinal"
          # failed the Windows plugin check: no sound, no editor). The bundles are named
          # CardinalSynth.vst3 and CardinalFX.vst3.
          Get-Plugin 'Cardinal' 'DISTRHO/Cardinal' '(?i)win64.*\.zip$' '' '^Cardinal(Synth|FX)\.vst3$' | Out-Null
          # Dragonfly: VST3 only (the CLAP builds' editors do not open in the check).
          Get-Plugin 'Dragonfly Reverb' 'michaelwillis/dragonfly-reverb' '(?i)win64.*\.zip$' '' '\.vst3$' | Out-Null
          if (-not $surge) { throw 'Surge XT could not be fetched' }
          # Surge XT's factory patches and wavetables: the plugins-only zip has none, so take
          # them from the source of the same release ("portable" data folder next to the plugin).
          foreach ($tag in "release_xt_$surge", $surge) {
            try {
              Invoke-WebRequest "https://github.com/surge-synthesizer/surge/archive/refs/tags/$tag.zip" -OutFile dl\surge-src.zip
              Expand-Archive dl\surge-src.zip -DestinationPath dl\surge-src
              $root = Get-ChildItem dl\surge-src -Directory | Select-Object -First 1
              Copy-Item "$($root.FullName)\resources\data" "$out\SurgeXTData" -Recurse
              break
            } catch { Write-Host "no source archive for tag $tag" }
          }
          if (-not (Test-Path "$out\SurgeXTData")) { Write-Warning "Surge XT factory data not found; Surge XT starts without its presets" }
          # The installer builder (NSIS) cannot take '$' in file names (e.g. "Ka$$h.fxp").
          Get-ChildItem $out -Recurse | Where-Object { $_.Name -match '\$' } |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Rename-Item -LiteralPath $_.FullName -NewName ($_.Name -replace '\$', 'S'); Write-Host "renamed $($_.Name)" }
          $lines = @('Plugins shipped with Musiton', '============================', '') + $shipped + @('',
            'They are free software, each under its own licence (see the licenses folder).',
            'They are separate programs that Musiton loads; Musiton itself is not covered by their licences.')
          $lines | Set-Content "$out\README.txt"
          Get-Content "$out\README.txt"
          Get-ChildItem $out
      - name: Build installer
        working-directory: crates/musiton-app
        run: cargo packager --release
      - uses: actions/upload-artifact@v4
        with:
          name: Musiton-setup
          path: target/packages/*.exe
          if-no-files-found: error
      - name: Portable exe
        shell: pwsh
        run: |
          # Start clean: the build cache can keep an older folder, and copying into an
          # existing plugins folder would nest it (plugins/plugins).
          Remove-Item -Recurse -Force target/portable -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force target/portable | Out-Null
          Copy-Item target/release/musiton.exe target/portable/Musiton.exe
          Copy-Item target/release/ffmpeg.exe target/portable/ffmpeg.exe
          Copy-Item target/release/FFMPEG-LICENSE.txt target/portable/FFMPEG-LICENSE.txt
          Copy-Item target/release/plugins target/portable/plugins -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Musiton-portable
          path: target/portable/
          if-no-files-found: error
