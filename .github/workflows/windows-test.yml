name: Windows test

# Tests the Windows build on a real Windows machine: installs free plugins, runs the plugin
# self-test and drives the app through its remote control. Report and screenshots are
# uploaded as the "windows-test" artifact.

on:
  workflow_run:
    workflows: [Windows installer]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the portable build
        shell: pwsh
        run: |
          $run = '${{ github.event.workflow_run.id }}'
          if (-not $run) {
            $run = gh run list -R $env:GITHUB_REPOSITORY --workflow installer.yml --status success -L 1 --json databaseId --jq '.[0].databaseId'
          }
          Write-Host "Installer run $run"
          gh run download $run -R $env:GITHUB_REPOSITORY -n Musiton-portable -D app
          Get-ChildItem app
      - name: Bundled FFmpeg can write MP3 and OGG
        shell: pwsh
        run: |
          $enc = & app\ffmpeg.exe -hide_banner -encoders
          foreach ($e in 'libmp3lame', 'libvorbis') {
            if (-not ($enc -match " $e ")) { throw "the bundled FFmpeg has no $e encoder" }
            Write-Host "$e found"
          }
      - name: Bundled plugins are in the build
        shell: pwsh
        run: |
          Get-ChildItem app\plugins
          foreach ($p in 'Surge XT.vst3', 'Surge XT.clap', 'Dexed.vst3', 'Dexed.clap') {
            if (-not (Test-Path "app\plugins\$p")) { Write-Warning "missing bundled plugin: $p" }
          }
      - name: Plugin self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $p = Start-Process app\Musiton.exe -ArgumentList '--check-plugins', "$PWD\out\plugin-report.txt" -Wait -PassThru
          Get-Content out\plugin-report.txt
          Get-Content out\plugin-report.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "check exited with $($p.ExitCode)" }
          if (Select-String -Path out\plugin-report.txt -Pattern '^\s+FAIL' -Quiet) { throw 'the plugin check found failures' }
      - name: Drive the app by remote control
        shell: pwsh
        run: |
          $exe = "$PWD\app\Musiton.exe"
          $endpoint = "$env:APPDATA\Musiton\data\remote.json"
          Remove-Item $endpoint -ErrorAction SilentlyContinue
          function Remote([string]$json) {
            Set-Content -Encoding utf8NoBOM cmd.json $json
            Start-Process $exe -ArgumentList '--remote', "@$PWD\cmd.json" -Wait -NoNewWindow -RedirectStandardOutput answer.txt | Out-Null
            $a = Get-Content answer.txt -Raw
            Write-Host "> $json`n< $a"
            "> $json`n< $a" | Out-File -Append out\remote.txt
          }
          Start-Process $exe -ArgumentList '--remote-control'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $endpoint); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          Remote '{"cmd":"state"}'
          Remote "{`"cmd`":`"screenshot`",`"path`":`"$($PWD -replace '\\','/')/out/1-start.png`"}"
          Remote '{"cmd":"demo"}'
          Start-Sleep 5
          Remote '{"cmd":"state"}'
          Remote '{"cmd":"play"}'
          Start-Sleep 4
          Remote '{"cmd":"state"}'
          Remote "{`"cmd`":`"screenshot`",`"path`":`"$($PWD -replace '\\','/')/out/2-demo-playing.png`"}"
          Remote '{"cmd":"stop"}'
          Remote '{"cmd":"log","lines":80}'
          Remote '{"cmd":"quit"}'
          Start-Sleep 3
      - name: Collect the log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$env:APPDATA\Musiton\data\musiton.log" out\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: out/
