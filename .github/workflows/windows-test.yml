name: Windows test

# Tests the Windows build on a real Windows machine: installs free plugins, runs the plugin
# self-test and drives the app through its remote control. Report and screenshots are
# uploaded as the "windows-test" artifact.

on:
  workflow_run:
    workflows: [Windows installer]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the portable build
        shell: pwsh
        run: |
          $run = '${{ github.event.workflow_run.id }}'
          if (-not $run) {
            $run = gh run list -R $env:GITHUB_REPOSITORY --workflow installer.yml --status success -L 1 --json databaseId --jq '.[0].databaseId'
          }
          Write-Host "Installer run $run"
          gh run download $run -R $env:GITHUB_REPOSITORY -n Musiton-portable -D app
          Get-ChildItem app
      - name: Install free plugins (Surge XT, Dexed)
        shell: pwsh
        run: |
          $vst3 = "$env:CommonProgramFiles\VST3"; $clap = "$env:CommonProgramFiles\CLAP"
          New-Item -ItemType Directory -Force $vst3, $clap | Out-Null
          function Get-Plugins($repo, $pattern) {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            $asset = $rel.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
            if (-not $asset) { Write-Host "No asset for $repo; assets: $($rel.assets.name -join ', ')"; return }
            Write-Host "Using $($asset.name)"
            $dir = "dl\$($repo -replace '/','_')"
            Invoke-WebRequest $asset.browser_download_url -OutFile "$dir.zip"
            Expand-Archive "$dir.zip" -DestinationPath $dir
            # A .vst3 is a folder (bundle) or a file; never look inside a bundle.
            Get-ChildItem $dir -Recurse -Filter *.vst3 | Where-Object { $_.FullName -notmatch '\.vst3\\.+' } |
              ForEach-Object { Copy-Item $_.FullName $vst3 -Recurse -Force; Write-Host "VST3: $($_.Name)" }
            Get-ChildItem $dir -Recurse -Filter *.clap -File |
              ForEach-Object { Copy-Item $_.FullName $clap -Force; Write-Host "CLAP: $($_.Name)" }
          }
          New-Item -ItemType Directory -Force dl | Out-Null
          Get-Plugins 'surge-synthesizer/releases-xt' 'win64.*pluginsonly.*\.zip$'
          Get-Plugins 'asb2m10/dexed' '(?i)win.*\.zip$'
          Get-ChildItem $vst3, $clap
      - name: Plugin self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $p = Start-Process app\Musiton.exe -ArgumentList '--check-plugins', "$PWD\out\plugin-report.txt" -Wait -PassThru
          Get-Content out\plugin-report.txt
          Get-Content out\plugin-report.txt | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($p.ExitCode -ne 0) { throw "check exited with $($p.ExitCode)" }
      - name: Drive the app by remote control
        shell: pwsh
        run: |
          $exe = "$PWD\app\Musiton.exe"
          $endpoint = "$env:APPDATA\Musiton\data\remote.json"
          Remove-Item $endpoint -ErrorAction SilentlyContinue
          function R([string]$json) {
            Set-Content -Encoding utf8NoBOM cmd.json $json
            Start-Process $exe -ArgumentList '--remote', "@$PWD\cmd.json" -Wait -NoNewWindow -RedirectStandardOutput answer.txt | Out-Null
            $a = Get-Content answer.txt -Raw
            Write-Host "> $json`n< $a"
            "> $json`n< $a" | Out-File -Append out\remote.txt
          }
          Start-Process $exe -ArgumentList '--remote-control'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $endpoint); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          R '{"cmd":"state"}'
          R "{`"cmd`":`"screenshot`",`"path`":`"$($PWD -replace '\\','/')/out/1-start.png`"}"
          R '{"cmd":"demo"}'
          Start-Sleep 5
          R '{"cmd":"state"}'
          R '{"cmd":"play"}'
          Start-Sleep 4
          R '{"cmd":"state"}'
          R "{`"cmd`":`"screenshot`",`"path`":`"$($PWD -replace '\\','/')/out/2-demo-playing.png`"}"
          R '{"cmd":"stop"}'
          R '{"cmd":"log","lines":80}'
          R '{"cmd":"quit"}'
          Start-Sleep 3
      - name: Collect the log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$env:APPDATA\Musiton\data\musiton.log" out\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: out/
